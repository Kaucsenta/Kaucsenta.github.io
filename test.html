<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM-Based Yarn Cursor</title>
  <style>
    html, body, canvas, .custom-cursor {
        cursor: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='), auto !important;
    }
    body {
      margin: 0;
      overflow: hidden;     
    }
    .custom-cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      background-image: url('needle_cursor.png');
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1001;
    }
    .yarn-piece {
      position: fixed;
      width: 8px;
      height: 8px;
      background-image: url('knit_texture.png');
      background-size: cover;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="cursor" class="custom-cursor"></div>

  <script>
    const cursor = document.getElementById('cursor');
    const yarnLength = 12;
    const yarn = [];

    for (let i = 0; i < yarnLength; i++) {
      const piece = document.createElement('div');
      piece.classList.add('yarn-piece');
      document.body.appendChild(piece);
      yarn.push({ el: piece, x: window.innerWidth / 2, y: window.innerHeight / 2 });
    }

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX + 16;
      mouseY = e.clientY + 16;
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });

    function animate() {
      let prevX = mouseX;
      let prevY = mouseY;

      for (let i = 0; i < yarn.length; i++) {
        let seg = yarn[i];
        let dx = seg.x - prevX;
        let dy = seg.y - prevY;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let force = (dist - 12) * 0.2;

        let offsetX = (dx / dist) * force;
        let offsetY = (dy / dist) * force;

        if (!isNaN(offsetX)) seg.x -= offsetX;
        if (!isNaN(offsetY)) seg.y -= offsetY;

        seg.el.style.transform = `translate(${seg.x}px, ${seg.y}px)`;

        prevX = seg.x;
        prevY = seg.y;
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
