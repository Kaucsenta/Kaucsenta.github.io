<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yarn Cursor Trail</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      cursor: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
    }
    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      background-image: url('needle_cursor.png'); /* Use your needle/yarn image */
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <div class="custom-cursor" id="cursor"></div>

  <script>
    const canvas = document.getElementById('trail');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    const ropeLength = 25;
    const rope = Array.from({ length: ropeLength }, (_, i) => ({
      x: width / 2,
      y: height / 2 + i * 10,
      oldx: width / 2,
      oldy: height / 2 + i * 10
    }));

    let mouse = { x: width / 2, y: height / 2 };

    document.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursor.style.transform = `translate(${mouse.x}px, ${mouse.y}px)`;
    });

    function physics() {
      // Verlet integration
      for (let p of rope) {
        const vx = (p.x - p.oldx) * 0.98;
        const vy = (p.y - p.oldy) * 0.98 + 0.2; // gravity
        p.oldx = p.x;
        p.oldy = p.y;
        p.x += vx;
        p.y += vy;
      }

      // stick the first point to the cursor
      rope[0].x = mouse.x;
      rope[0].y = mouse.y;

      // Constrain points to simulate string
      for (let i = 0; i < 5; i++) {
        for (let j = 1; j < rope.length; j++) {
          const p1 = rope[j - 1];
          const p2 = rope[j];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const diff = (dist - 10) / dist;
          const offsetX = dx * 0.5 * diff;
          const offsetY = dy * 0.5 * diff;

          if (j !== 1) {
            p1.x += offsetX;
            p1.y += offsetY;
          }

          p2.x -= offsetX;
          p2.y -= offsetY;
        }
      }
    }

    function drawYarn() {
      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.moveTo(rope[0].x, rope[0].y);
      for (let i = 1; i < rope.length; i++) {
        ctx.lineTo(rope[i].x, rope[i].y);
      }
      ctx.strokeStyle = '#d49ac3';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function animate() {
      physics();
      drawYarn();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
