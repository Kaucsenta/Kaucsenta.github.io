<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Single Yarn Trail Cursor</title>
  <style>
    html, body, canvas, .custom-cursor {
        cursor: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='), auto !important;
    }
    body {
      margin: 0;
      overflow: hidden;
      cursor: none;
    }
    .custom-cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      background-image: url('needle_cursor.png');
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1001;
    }
    .yarn-line {
      position: fixed;
      width: 4px;
      background-image: url('knit_texture.png');
      background-size: cover;
      transform-origin: top left;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="cursor" class="custom-cursor"></div>
  <div id="yarn" class="yarn-line"></div>

  <script>
    const cursor = document.getElementById('cursor');
    const yarn = document.getElementById('yarn');

    let yarnX = window.innerWidth / 2;
    let yarnY = window.innerHeight / 2 + 100;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX + 16;
      mouseY = e.clientY + 16;
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });

    function animate() {
      // Simulate heavy yarn with slow easing
      yarnX += (mouseX - yarnX) * 0.05;
      yarnY += (mouseY - yarnY) * 0.05;

      const dx = mouseX - yarnX;
      const dy = mouseY - yarnY;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * (180 / Math.PI);

      yarn.style.height = `${length}px`;
      yarn.style.transform = `translate(${yarnX}px, ${yarnY}px) rotate(${angle}deg)`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
