<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yarn Cursor Trail with Texture</title>
  <style>
    body {
  margin: 0;
  overflow: hidden;
  cursor: url(needle_cursor.png), auto; /* Replace with your custom cursor */
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <div id="cursor"></div>

  <script>
    const canvas = document.getElementById('trail');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    const ropeLength = 12;
    const rope = Array.from({ length: ropeLength }, (_, i) => ({
      x: width / 2,
      y: height / 2 + i * 10,
      oldx: width / 2,
      oldy: height / 2 + i * 10
    }));

    let mouse = { x: width / 2, y: height / 2 };

    document.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursor.style.transform = `translate(${mouse.x}px, ${mouse.y}px)`;
    });

    // Load knitted texture
    const texture = new Image();
    texture.src = 'knit_texture.png'; // Replace with your knitted texture image
    let pattern;
    texture.onload = () => {
      pattern = ctx.createPattern(texture, 'repeat');
    };

  function physics() {
    for (let p of rope) {
      const vx = (p.x - p.oldx) * 0.85;  // Less velocity retained (was 0.95)
      const vy = (p.y - p.oldy) * 0.85 + 1.5; // More gravity pull (was 0.5)
      p.oldx = p.x;
      p.oldy = p.y;
      p.x += vx;
      p.y += vy;
    }

    rope[0].x = mouse.x + 16;
    rope[0].y = mouse.y + 16;

    for (let i = 0; i < 5; i++) {
      for (let j = 1; j < rope.length; j++) {
        const p1 = rope[j - 1];
        const p2 = rope[j];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const diff = (dist - 12) / dist;
        const offsetX = dx * 0.5 * diff;
        const offsetY = dy * 0.5 * diff;

        if (j !== 1) {
          p1.x += offsetX;
          p1.y += offsetY;
        }

        p2.x -= offsetX;
        p2.y -= offsetY;
      }
    }
  }

    function drawYarn() {
      ctx.clearRect(0, 0, width, height);
      if (pattern) {
        ctx.strokeStyle = pattern;
      } else {
        ctx.strokeStyle = '#d49ac3';
      }
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(rope[0].x, rope[0].y);
      for (let i = 1; i < rope.length; i++) {
        ctx.lineTo(rope[i].x, rope[i].y);
      }
      ctx.stroke();
    }

    function animate() {
      physics();
      drawYarn();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
